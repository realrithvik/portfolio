title: About the dot
body: |-
  In my name — **Ṛithvik** — there is a dot under the R. It's a small mark, easy to miss. But it's part of who I am, and it became the idea behind this portfolio.

  A dot is a beginning. A full stop. A point on a timeline. In design, it's the smallest unit that still carries meaning — a shape, a pause, a place to rest your eye.

  I'm a designer drawn to how forms carry feeling — whether that's the emotional language of shape in horology, the negative space between letterforms on a folded brochure, or the interaction that welcomes someone at a conference booth.

  This site is project-based because that's how I think: each piece of work is a story with a beginning, a turn, and something that lingers. I hope it feels warm here. Pull up a chair.
