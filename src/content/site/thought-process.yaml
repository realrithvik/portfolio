beats:
  - icon: read
    title: Read
    body: >-
      Every project starts before I say a word. I watch, listen, and ask the small
      questions that open things up — because half of what matters hasn't been said
      yet.
  - icon: empathize
    title: Empathize
    body: >-
      Then I sit with what I've heard. I put myself in your position — that's when a
      project stops being about deliverables and starts being about people.
  - icon: define
    title: Define
    body: >-
      I name what we're actually solving. Not the brief — the tension underneath it.
      That's the story worth telling, and every choice from here serves it.
  - icon: shape
    title: Shape
    body: >-
      I work in form, type, and rhythm. Every shape carries feeling; every line holds
      intent. The medium becomes part of the message.
  - icon: tell
    title: Tell
    body: >-
      I orchestrate it all into something you can hold, scroll through, or step into.
      A project isn't finished until someone else feels the story.
