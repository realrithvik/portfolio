title: The Shape of Time
hook: >-
  Twenty-four shapes for twenty-four stages of life — horology sold as a
  feeling, not a product.
year: '2026'
role: Master's Project
tags:
  - Research
  - Editorial
  - Print
  - Horology
accent: '#e8c96b'
heroImage: /images/projects/shape-of-time/heroImage.png
chapters:
  - title: The problem
    body: >-
      The empathy of shapes has always intrigued me — why certain forms carry
      certain feelings. That question became the basis of my year-long Master's
      project.


      I wanted to understand whether design could sell horology not as a
      product, but as an emotion — something you feel across a lifetime, not
      just read on a dial.
  - title: The insight
    body: >-
      I mapped human life to time itself. According to research, human life
      spans around 70 to 73 years. I treated a day as a metaphor: 24 hours, 24
      stages of life — with each hour representing roughly three years.


      I assigned emotions to each stage — from Birth and Eager, through Love and
      Stability, to Acceptance and beyond. Then I connected each emotion to a
      watch part whose shape matched that feeling.


      The timepiece became a generational artifact, not just a mechanism.
  - title: The process
    body: >-
      Twenty-four shapes for twenty-four stages of life — each one mapped to the
      watch part whose form matches its emotion.


      I built the final project around Jaeger-LeCoultre, an ultra-luxury watch
      brand known for some of the most complicated and beautiful watches in the
      world.


      I represented day and night through colour, inverting the hour hand so it
      stayed visible against both. I split the transition from black to white
      into twelve shades of grey, spreading them across the day-night cycle. The
      watch face only shows twelve hours, so to cover all twenty-four, I let the
      light and dark backgrounds themselves carry the second cycle.
  - title: The outcome
    body: >-
      I bound the book so it opens a full 360 degrees — recreating the circular
      motion of a watch hand.


      As you move through the brochure, the colour shifts from dark to light and
      back to dark, mimicking the cycle of a day. The shapes and poem tie each
      time of day to a stage of life, binding the shapes, the life, and the hour
      together.


      Together they tell the story of a life.
  - title: The dot
    body: >-
      Research became something you could hold and turn. Every shape had a
      reason. Every shade of grey carried time forward.


      This project taught me that the most luxurious design isn't decoration —
      it's making someone feel the weight of a moment.
